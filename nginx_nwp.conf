server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nwp.gdmo.gq;

    ssl_certificate /etc/nginx/ssl/gdmo.gq/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/gdmo.gq/gdmo.gq.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 10m;
    ssl_session_cache builtin:1000 shared:SSL:10m;
    ssl_buffer_size 1400;
    add_header Strict-Transport-Security max-age=15768000;

    client_max_body_size 50m;

    gzip on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    location = /data {
        return 301 /data/;
    }

    location /data/ {
        alias /data/weather_vis/;
        autoindex off;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        root /var/www/html/nwp_weather_system/vis_web/dist;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        root /var/www/html/nwp_weather_system/vis_web/dist;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

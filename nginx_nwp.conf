# 依赖 /etc/nginx/nginx.conf 的 main 段定义（本文件是 conf.d 下的 server 块，无法自行声明）：
#   worker_rlimit_nofile 65535;                             # 见下方 open_file_cache 说明
#   thread_pool weather_io threads=32 max_queue=65536;      # 见下方 @cold_* 的 aio
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nwp.gdmo.gq;

    ssl_certificate /etc/nginx/ssl/gdmo.gq/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/gdmo.gq/gdmo.gq.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 10m;
    ssl_session_cache builtin:1000 shared:SSL:10m;
    ssl_buffer_size 1400;
    add_header Strict-Transport-Security max-age=15768000;

    client_max_body_size 50m;

    gzip on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    location = /data {
        return 301 /data/;
    }

    # 热/冷两级存储。热盘是本地 SSD（近 7 天），冷盘是 NFS（更早的数据）。
    # try_files 先查热盘、未命中再回落冷盘；前端 URL 不变，迁移对客户端透明。
    # 实测本地盘读约 2 ms、NFS 冷读约 1 s，命中热盘是性能关键。
    #
    # 两级都用 root（不用 alias），因此两个根目录下都需要一个 data 子项：
    #   sudo mkdir -p /srv/weather/hot/data
    #   sudo chown -R minhill:minhill /srv/weather/hot
    #   sudo mkdir -p /srv/weather/cold
    #   sudo ln -sfn /data/weather_vis /srv/weather/cold/data
    # 于是 /data/products/x.svg 依次查找
    #   /srv/weather/hot/data/products/x.svg  然后  /data/weather_vis/products/x.svg
    location /data/ {
        root /srv/weather/hot;
        autoindex off;
        try_files $uri @cold_data;
        add_header Cache-Control "no-cache";
    }

    # 起报时次目录不会被覆盖；SVG 可由浏览器和中间缓存长期复用。
    # manifest 仍命中上面的 no-cache，确保客户端能及时发现新生成的产品。
    location ~ "^/data/products/[0-9]{10}/.+\.svg$" {
        root /srv/weather/hot;
        try_files $uri @cold_svg;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        # open_file_cache 缓存的是「打开的文件描述符」本身，每个条目占 1 个 FD。
        # max 必须显著小于 worker_rlimit_nofile，否则缓存填满后该 worker 内任何
        # open() 都会失败并返回 500 —— 包括无关的 dist/index.html。
        # 曾用 max=20000 配 FD 上限 1024（未设 worker_rlimit_nofile 时的默认），
        # 导致首页间歇性 500（error.log: "Too many open files"）。
        # 本层瓦片一次浏览多为「各不相同、只请求一两次」，缓存命中率本就有限，
        # 因此取一个保守值即可，收益主要来自 manifest 等重复请求。
        open_file_cache max=2000 inactive=2m;
        open_file_cache_valid 1m;
        open_file_cache_min_uses 1;
        open_file_cache_errors off;
    }

    # 冷盘回落。NFS 是阻塞式读取，用线程池把慢读移出 worker，避免单个 NFS 请求
    # 阻塞同一 worker 上的其他请求（含热盘请求）。
    # 前置条件：nginx 需 --with-threads（已确认），并在 nginx.conf 的 main 段定义
    #   thread_pool weather_io threads=32 max_queue=65536;
    location @cold_data {
        root /srv/weather/cold;
        aio threads=weather_io;
        add_header Cache-Control "no-cache";
        add_header X-Weather-Tier "cold" always;
    }

    location @cold_svg {
        root /srv/weather/cold;
        aio threads=weather_io;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        add_header X-Weather-Tier "cold" always;
        # 同上：条目数受 worker_rlimit_nofile 约束，不可设成上万。
        open_file_cache max=2000 inactive=2m;
        open_file_cache_valid 1m;
        open_file_cache_min_uses 1;
        open_file_cache_errors off;
    }

    location /assets/ {
        root /var/www/html/nwp_weather_system/vis_web/dist;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Web Push 订阅服务反代（与 server/.env 的 WEATHER_PUSH_PORT 保持一致）。
    location /api/ {
        proxy_pass http://127.0.0.1:49173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /var/www/html/nwp_weather_system/vis_web/dist;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
